<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="sfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#60a5fa"/>
        </linearGradient>
        <filter id="sfShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Circular Badge with Gradient -->
    <circle cx="50" cy="50" r="50" fill="url(#sfGradient)"/>

    <!-- Inner subtle ring -->
    <circle cx="50" cy="50" r="47" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>

    <!-- Bold 'SF' Monogram -->
    <text x="50" y="52" dominant-baseline="central" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="42" font-weight="900" letter-spacing="-1.5" filter="url(#sfShadow)">SF</text>
</svg>
