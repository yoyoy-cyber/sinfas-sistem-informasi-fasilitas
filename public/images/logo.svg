<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="sfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <filter id="sfShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Circular Background with subtle white border -->
    <circle cx="50" cy="50" r="46" fill="url(#sfGradient)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Bold 'SF' Monogram matching app style -->
    <text x="50" y="53" dominant-baseline="central" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" filter="url(#sfShadow)">SF</text>
</svg>
